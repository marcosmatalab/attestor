name: CI

# Actions are pinned to commit SHAs, not tags. A tag is mutable: pinning the toolchain
# in pyproject.toml while the workflow follows a moving tag leaves the same hole open,
# just through a different door.

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # One step, on purpose. `make check` is what a contributor runs locally, so
      # running the same target here is the only way the Makefile is ever actually
      # tested -- and it removes the chance of the two lists drifting apart.
      # It runs, in order: ruff check, ruff format --check, mypy, vulture, pytest
      # (whose addopts carry the coverage floor).
      - name: All gates (make check)
        run: make check

  frontend:
    name: Frontend build & test (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Build first: Next generates next-env.d.ts + .next/types that the type-check needs.
      - name: Build (Turbopack)
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test
