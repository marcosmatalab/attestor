[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestor"
dynamic = ["version"]
description = "Deterministic EU AI Act compliance engine: risk classification, Annex IV dossier with validated citations, C2PA provenance, and an offline-verifiable cryptographic ledger."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marcos Mata García", email = "matagarciamarcos@gmail.com" }]
keywords = [
    "eu-ai-act",
    "compliance",
    "ai-governance",
    "c2pa",
    "provenance",
    "ledger",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "reportlab>=4",
    "c2pa-python==0.36.0",
    "cryptography>=43",
    "rfc3161-client==1.0.6",
]

[project.optional-dependencies]
# Exact pins, not ranges. A range is how this CI broke once already: ruff 0.16 began
# formatting Python blocks inside Markdown and the format gate went red without anyone
# touching the repository. Upgrading is now a commit, not an accident.
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "vulture==2.16",
    "types-reportlab==5.0.0.20260911",
    "types-PyYAML==6.0.12.20260906",
]
# Deliberately NOT in `dev`. Re-capturing docs/dashboard.png needs a real browser, which
# is a ~150 MB download; CI runs the two capture tests, and neither of them opens one.
capture = [
    "playwright==1.58.0",
]

[project.scripts]
attestor = "attestor.cli:main"

[tool.hatch.version]
path = "src/attestor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/attestor"]

[[tool.mypy.overrides]]
# c2pa-python ships no py.typed marker and no stubs. Everything this repo does with
# it is wrapped inside attestor.provenance, whose own surface is fully typed.
module = ["c2pa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is not here on purpose. A floor in addopts applies to every invocation, so
# `pytest tests/test_architecture.py` passed all its tests and still exited 1 on a 0%
# total. The coverage gate lives in the Makefile's `test` target, which CI runs.
addopts = "-q"
