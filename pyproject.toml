[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestor"
dynamic = ["version"]
description = "Deterministic EU AI Act compliance engine: risk classification, Annex IV dossier with validated citations, C2PA provenance, and an offline-verifiable cryptographic ledger."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marcos Mata García", email = "matagarciamarcos@gmail.com" }]
keywords = [
    "eu-ai-act",
    "compliance",
    "ai-governance",
    "c2pa",
    "provenance",
    "ledger",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "reportlab>=4",
    "cryptography>=45",
    "c2pa-python>=0.37",
]

[project.optional-dependencies]
# Exact pins, not ranges. A range is how this CI broke once already: ruff 0.16
# started formatting Python blocks inside Markdown and the format gate went red
# without anyone touching the repository. Upgrading is now a commit, not an
# accident.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "vulture==2.16",
    "types-PyYAML==6.0.12.20260906",
    "types-reportlab==5.0.0.20260911",
]

[project.scripts]
attestor = "attestor.cli:main"

[tool.hatch.version]
path = "src/attestor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/attestor"]

[[tool.mypy.overrides]]
# c2pa-python ships no py.typed marker and no stubs. Everything this repo does with
# it is wrapped in attestor.provenance, whose own surface is fully typed.
module = ["c2pa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The threshold sits at 95, two points below the 97 measured today, so a legitimate
# refactor has room and a real regression still trips it.
addopts = "-q --cov=src/attestor --cov-report=term-missing --cov-fail-under=95"
